<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f131a" />
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#dd6b20" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38" />
      <stop offset="100%" stop-color="#dd6b20" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="20" fill="#2d3748" stroke="#4a5568" stroke-width="2" />
    <polygon points="36,16 56,52 16,52" fill="url(#brandGrad)" />
    <circle cx="36" cy="40" r="7" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Brand Title -->
  <text x="195" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f7fafc" letter-spacing="-0.5">
    Paralux <tspan fill="#dd6b20">Extract AI</tspan>
  </text>

  <!-- Pill Badge -->
  <g transform="translate(100, 220)">
    <rect width="280" height="36" rx="18" fill="#dd6b20" fill-opacity="0.15" stroke="#dd6b20" stroke-opacity="0.4" />
    <text x="140" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#dd6b20" text-anchor="middle" letter-spacing="1.5">
      INTELLIGENT DOCUMENT API
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
    Transform Unstructured Docs
  </text>
  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#dd6b20" letter-spacing="-1.2">
    into Typed JSON Data
  </text>

  <!-- Subtitle -->
  <text x="100" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a0aec0">
    Extract invoices, receipts, and contracts with high-speed automated intelligence.
  </text>

  <!-- Features Footer Bar -->
  <g transform="translate(100, 520)">
    <rect width="1000" height="55" rx="14" fill="#202734" stroke="#4a5568" stroke-width="1.5" />
    
    <text x="40" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f7fafc">
      ⚡ Plans from $20/mo
    </text>
    <circle cx="240" cy="27" r="3" fill="#4a5568" />
    
    <text x="270" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f7fafc">
      🎁 50 Free Signup Credits
    </text>
    <circle cx="510" cy="27" r="3" fill="#4a5568" />

    <text x="540" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f7fafc">
      🔒 24h Ephemeral Zero-Storage
    </text>
    <circle cx="830" cy="27" r="3" fill="#4a5568" />

    <text x="860" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#dd6b20">
      Node.js &amp; Python SDK
    </text>
  </g>
</svg>
