version: 2
updates:
  # Root frontend (React 19, Vite, Tailwind v4, Firebase Web SDK)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block automatic PRs for breaking major versions (e.g. React 20, Vite 9)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  # Cloud Functions backend (Node 22, @google/adk, Express, Zod)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      # Block breaking major versions (e.g. Node types 26 when runtime is Node 22, Firebase-admin 14)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
