version: 2
updates:
  # Root frontend (React 19, Vite, Tailwind v4, Firebase Web SDK)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # Cloud Functions backend (Node 22, @google/adk, Express, Zod)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "staging"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
