name: CI/CD & Deploy to Firebase Hosting

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build

      - name: Install & Build Cloud Functions
        run: |
          cd functions
          npm ci
          npm run build

  deploy-staging:
    name: Deploy to Staging (Firebase Hosting)
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (Staging Site)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARALUX_EXTRACT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: paralux-extract
          target: staging
          channelId: live

  deploy-prod:
    name: Deploy to Production (Firebase Hosting)
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (Production Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PARALUX_EXTRACT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: paralux-extract
          target: prod
          channelId: live
