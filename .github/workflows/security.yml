name: Security & Secret Scan

on:
  push: # Runs on pushes to ANY branch to detect leaked secrets immediately
  pull_request: # Runs on all pull requests
  schedule:
    - cron: '0 6 * * 1' # Weekly scan every Monday at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Leak Scan (Gitleaks Open-Source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history is required to inspect all commits

      - name: Install Gitleaks Binary
        run: |
          VERSION=8.24.0
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/
          rm gitleaks gitleaks.tar.gz

      - name: Run Gitleaks Detect
        run: gitleaks detect --verbose --redact --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit backend functions dependencies
        run: |
          cd functions
          npm audit --audit-level=high
